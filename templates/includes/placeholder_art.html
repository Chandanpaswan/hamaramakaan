<svg class="ph-art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="{{ label|default:'Illustration, photos coming soon' }}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky{{ uid }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8EEFC"/><stop offset="1" stop-color="#FBF6EE"/></linearGradient>
    <pattern id="win{{ uid }}" width="22" height="26" patternUnits="userSpaceOnUse"><rect x="5" y="6" width="12" height="13" rx="2" fill="#E8EEFC"/></pattern>
    <pattern id="winb{{ uid }}" width="20" height="24" patternUnits="userSpaceOnUse"><rect x="4" y="5" width="12" height="12" rx="2" fill="#EBE5DA"/></pattern>
  </defs>
  <rect width="400" height="300" fill="url(#sky{{ uid }})"/>
  <circle cx="318" cy="66" r="30" fill="#F2A93B" opacity=".55"/>
  <rect y="262" width="400" height="38" fill="#D7DEEC"/>
  {% if kind == "house" %}
    <circle cx="70" cy="236" r="22" fill="#5B8A6B" opacity=".75"/><rect x="67" y="236" width="6" height="28" fill="#6B5B4B"/>
    <circle cx="338" cy="232" r="24" fill="#5B8A6B" opacity=".75"/><rect x="335" y="232" width="6" height="32" fill="#6B5B4B"/>
    <polygon points="200,92 316,168 84,168" fill="#E8875C"/>
    <rect x="232" y="104" width="18" height="34" fill="#B8461F"/>
    <rect x="110" y="166" width="180" height="96" fill="#1D4ED8"/>
    <circle cx="200" cy="140" r="9" fill="#F2A93B"/>
    <rect x="128" y="184" width="40" height="32" rx="3" fill="#E8EEFC"/><rect x="232" y="184" width="40" height="32" rx="3" fill="#E8EEFC"/>
    <rect x="184" y="206" width="32" height="56" rx="3" fill="#FBF6EE"/>
  {% elif kind == "plot" %}
    <polygon points="20,262 380,262 340,206 60,206" fill="#C9D6B5"/>
    <polygon points="70,256 330,256 300,214 100,214" fill="none" stroke="#B8461F" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="262" y="146" width="6" height="68" fill="#0B1F4D"/><rect x="234" y="128" width="62" height="34" rx="4" fill="#fff" stroke="#1D4ED8" stroke-width="3"/>
    <text x="265" y="151" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D4ED8">PLOT</text>
    <circle cx="74" cy="196" r="18" fill="#5B8A6B" opacity=".8"/><rect x="71" y="196" width="6" height="22" fill="#6B5B4B"/>
  {% elif kind == "shop" %}
    <rect x="70" y="120" width="260" height="142" fill="#1D4ED8"/>
    <rect x="70" y="104" width="260" height="22" fill="#0B1F4D"/>
    <path d="M70 126h260v24c-10 10-22 10-32 0-10 10-22 10-32 0-10 10-22 10-32 0-10 10-22 10-32 0-10 10-22 10-32 0-10 10-22 10-32 0-10 10-22 10-32 0-10 10-22 10-32 0z" fill="#E8875C"/>
    <rect x="96" y="168" width="96" height="94" fill="#C8D0DD"/><rect x="208" y="168" width="96" height="94" fill="#C8D0DD"/>
    <g stroke="#AEB8C9" stroke-width="2">{% for y in "12345678"|make_list %}<line x1="96" x2="192" y1="{% widthratio forloop.counter 1 11 %}" y2="{% widthratio forloop.counter 1 11 %}" transform="translate(0 168)"/><line x1="208" x2="304" y1="{% widthratio forloop.counter 1 11 %}" y2="{% widthratio forloop.counter 1 11 %}" transform="translate(0 168)"/>{% endfor %}</g>
  {% elif kind == "office" %}
    <rect x="140" y="56" width="120" height="206" fill="#0B1F4D"/>
    <rect x="140" y="56" width="120" height="206" fill="url(#win{{ uid }})"/>
    <rect x="60" y="140" width="80" height="122" fill="#1D4ED8"/><rect x="60" y="140" width="80" height="122" fill="url(#winb{{ uid }})"/>
    <rect x="260" y="118" width="84" height="144" fill="#1D4ED8"/><rect x="260" y="118" width="84" height="144" fill="url(#winb{{ uid }})"/>
    <rect x="184" y="232" width="32" height="30" fill="#FBF6EE"/>
  {% elif kind == "warehouse" %}
    <path d="M40 262V150q160-60 320 0v112z" fill="#0B1F4D"/>
    <path d="M40 150q160-60 320 0" fill="none" stroke="#1D4ED8" stroke-width="10"/>
    <rect x="86" y="180" width="80" height="82" fill="#C8D0DD"/><rect x="234" y="180" width="80" height="82" fill="#C8D0DD"/>
    <g stroke="#AEB8C9" stroke-width="2">{% for y in "1234567"|make_list %}<line x1="86" x2="166" y1="{% widthratio forloop.counter 1 11 %}" y2="{% widthratio forloop.counter 1 11 %}" transform="translate(0 180)"/><line x1="234" x2="314" y1="{% widthratio forloop.counter 1 11 %}" y2="{% widthratio forloop.counter 1 11 %}" transform="translate(0 180)"/>{% endfor %}</g>
    <rect x="186" y="200" width="28" height="18" rx="2" fill="#F2A93B"/>
  {% else %}
    <rect x="86" y="70" width="110" height="192" fill="#1D4ED8"/>
    <rect x="86" y="70" width="110" height="192" fill="url(#win{{ uid }})"/>
    <rect x="206" y="128" width="120" height="134" fill="#0B1F4D"/>
    <rect x="206" y="128" width="120" height="134" fill="url(#winb{{ uid }})"/>
    <rect x="126" y="234" width="28" height="28" fill="#FBF6EE"/>
  {% endif %}
</svg>
