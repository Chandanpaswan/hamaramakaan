<form method="post" action="{{ action|default:'' }}#enquire" novalidate>
  {% csrf_token %}
  {% for field in form %}{% include "includes/field.html" %}{% endfor %}
  <button type="submit" class="btn btn-primary w-100" {% if preview %}disabled{% endif %}>{% icon "phone" 18 %} {{ submit_label|default:"Send enquiry" }}</button>
  <p class="form-text mt-2 mb-0">We use your details only to respond to this enquiry. See our <a href="{% url 'pages:privacy' %}">Privacy Policy</a>.</p>
</form>
