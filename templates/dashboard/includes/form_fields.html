{% if form.non_field_errors %}<div class="alert alert-danger">{% for e in form.non_field_errors %}<div>{{ e }}</div>{% endfor %}</div>{% endif %}
{% for field in form.hidden_fields %}{{ field }}{% endfor %}
<div class="row g-3">
  {% for field in form.visible_fields %}
    <div class="{% if field.widget_type == 'textarea' or field.widget_type == 'checkboxselectmultiple' or field.widget_type == 'selectmultiple' or field.widget_type == 'radioselect' %}col-12{% elif field.widget_type == 'checkbox' %}col-md-6 col-xl-4 d-flex align-items-end{% else %}col-md-6{% endif %}">
      {% include "includes/field.html" with wrapper_class="mb-0 w-100" %}
    </div>
  {% endfor %}
</div>
