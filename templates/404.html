{% extends "base.html" %}
{% block title %}Page not found | {{ brand_short }}{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="code" aria-hidden="true">404</div>
    <h1 class="h2 mt-3">We couldn’t find that page</h1>
    <p class="text-meta">The page may have moved, or the listing may no longer be available.</p>
    <form class="d-flex gap-2 mx-auto my-4" style="max-width:440px" method="get" action="{% url 'properties:list' %}" role="search">
      <label class="visually-hidden" for="nf-q">Search properties</label>
      <input class="form-control" id="nf-q" type="search" name="q" placeholder="Search properties" maxlength="100">
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
      <a class="chip" href="{% url 'core:home' %}">Home</a><a class="chip" href="{% url 'properties:buy' %}">Buy</a><a class="chip" href="{% url 'properties:rent' %}">Rent</a><a class="chip" href="{% url 'properties:projects' %}">New projects</a><a class="chip" href="{% url 'pages:contact' %}">Contact</a>
    </div>
  </div>
</div>
{% endblock %}
