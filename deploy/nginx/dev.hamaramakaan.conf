# Dev / staging: https://dev.hamaramakaan.com
# Password-protected and noindexed so customers and Google never land on it.
# HTTPS is added by certbot (`certbot --nginx`), which edits this file in place.

upstream hm_dev {
    server unix:/run/hamara-makaan-dev/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.hamaramakaan.com;

    client_max_body_size 60M;
    server_tokens off;

    auth_basic "Hamara Makaan dev";
    auth_basic_user_file /etc/nginx/hamaramakaan-dev.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Let's Encrypt renewals must not hit the password prompt
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location /media/ {
        alias /srv/hamara_makaan/dev/media/;
        expires 1d;
        add_header X-Content-Type-Options nosniff;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        location ~* \.(php|py|pl|sh|cgi|html?|svg|js)$ { deny all; }
    }

    location / {
        proxy_pass http://hm_dev;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 65s;
    }
}
