# hamaramakaan.com while the new app is NOT live yet.
# DNS for @ and www points at this VPS, but every request is forwarded to the old
# server, so visitors keep seeing the current website. Our Django code only runs on
# dev.hamaramakaan.com. Swap to hamaramakaan.conf when production goes live
# (docs/deployment.md, "Going live on hamaramakaan.com").
# HTTPS is added by certbot (`certbot --nginx`), which edits this file in place.

server {
    listen 80;
    listen [::]:80;
    server_name hamaramakaan.com www.hamaramakaan.com;

    client_max_body_size 60M;
    server_tokens off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_read_timeout 65s;

    location / {
        proxy_pass https://190.92.174.187;
    }

    # This VPS's certbot files are served here; other challenges (the old host's own SSL) pass through.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri @old_site;
    }

    location @old_site {
        proxy_pass https://190.92.174.187;
    }
}
