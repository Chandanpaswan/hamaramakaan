# Production: https://hamaramakaan.com  (www redirects to the bare domain)
# HTTPS is added by certbot (`certbot --nginx`), which edits this file in place.

upstream hm_prod {
    server unix:/run/hamara-makaan-prod/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.hamaramakaan.com;
    return 301 https://hamaramakaan.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name hamaramakaan.com;

    client_max_body_size 60M;   # up to 10 photos x 5 MB
    server_tokens off;

    location /media/ {
        alias /srv/hamara_makaan/prod/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        # Never execute or render anything active from uploads
        location ~* \.(php|py|pl|sh|cgi|html?|svg|js)$ { deny all; }
    }

    location / {
        proxy_pass http://hm_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 65s;
    }
}
